# Production, as Coolify deploys it: the compiled app (next build), not the
# dev server. The browser only ever talks to this; /api is forwarded to the
# backend. Restarts, the domain and HTTPS are Coolify's. DEPLOY.md in the
# backend repo covers both.

name: dkc-packing-frontend

services:
  frontend:
    # Named apart from the dev image, so neither setup can start the other's.
    image: dkc-packing-frontend:prod
    build:
      context: .
      target: prod
      args:
        NEXT_PUBLIC_API_URL: /api
        # The backend's https address. Compiled into the routing rules, so
        # changing it needs a redeploy, not a restart.
        API_PROXY_TARGET: ${API_PROXY_TARGET:?Set API_PROXY_TARGET in .env}
    # No published port: Coolify's proxy reaches it over Docker's network.
    expose:
      - "3000"
